[package]
name = "rnga-cli"
version.workspace = true
edition.workspace = true
description = "Command-Line Interface and MCP Server for NGA"
license.workspace = true
readme = "README.md"

[[bin]]
name = "rnga"
path = "src/main.rs"

[dependencies]
rnga = { version = "0.3.0", path = "../rNGA" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true, features = ["io-std"] }
comfy-table = "7"
colored = "3"
serde = { workspace = true }
serde_json = { workspace = true }
toon-format = { version = "0.5", default-features = false }
toml = "0.9"
anyhow = "1"
thiserror = { workspace = true }
chrono = { workspace = true }
futures = "0.3"
rmcp = { version = "0.12", features = ["server", "transport-io", "macros"] }
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-i18n = "3"
ratatui = "0.29"
crossterm = "0.29"
unicode-width = "0.2"
ib-pinyin = "0.3"
